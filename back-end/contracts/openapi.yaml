openapi: 3.1.0
info:
  title: Dhumi Demo Production API
  version: 0.1.0
  description: |
    Accepted mock-first implementation contract for the Dhumi Marketplace Dataset
    and Scraper Library demo. Customers call only Dhumi. Bright Data credentials,
    dataset IDs, snapshot IDs and raw errors are never public fields.
    Customer operations use browser sessions. The 0070 refactor removes the
    three /v1/keys operations and secret-response recovery.

    This contract has no activation, customer plan, subscription, billing,
    credit or quota endpoints. Organization, verification and member workflows follow 0071.
    Live Bright Data traffic remains controlled by external evidence gates.
  contact:
    name: Dhumi Engineering
  license:
    name: Proprietary - internal implementation contract
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.dhumi.example
    description: Reserved documentation placeholder; deployment base URL is pending.
tags:
  - name: Authentication
    description: Dhumi signup and browser-session lifecycle.
  - name: Workspace
    description: The Tenant workspace resolved from authenticated identity.
  - name: Catalogue
    description: Published provider-neutral Dhumi service templates.
  - name: Services
    description: Tenant-owned saved configurations.
  - name: Runs
    description: Durable asynchronous work and stored results.
  - name: Usage
    description: Informational tenant usage without quotas or billing.
  - name: Status
    description: Customer-safe Dhumi platform and product status.

paths:
  /v1/auth/signup:
    post:
      tags: [Authentication]
      operationId: signUp
      x-dhumi-access: public
      summary: Submit a local Dhumi signup
      description: |
        Creates only the local User, legal evidence and audit atomically.
        Creates no organization, membership, OTP or notification outbox.
        workspace_name is optional, deprecated and ignored. Makes no Bright Data request.
        Response is deliberately generic. An existing email follows the same
        accepted flow; 409 is reserved for the same Idempotency-Key used with a
        different canonical request body.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpInput'
      responses:
        '202':
          description: Signup submission accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: "Same Idempotency-Key was used with a different canonical request (IDEMPOTENCY_CONFLICT); never a duplicate-email signal"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/sign-in:
    post:
      tags: [Authentication]
      operationId: signIn
      x-dhumi-access: public
      summary: Sign in to Dhumi
      description: Creates a user/session token family without requiring organization membership.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInInput'
      responses:
        '200':
          description: Authenticated
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      x-dhumi-access: refresh_cookie_csrf
      summary: Rotate the browser session token family
      description: Refresh token is supplied through the approved secure cookie. Organization membership is not required.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      x-dhumi-access: browser_session
      summary: Revoke the current browser session family
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Signed out
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/workspace:
    get:
      tags: [Workspace]
      operationId: getWorkspace
      x-dhumi-access: organization_member
      summary: Get the authenticated Tenant workspace
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/catalog/templates:
    get:
      tags: [Catalogue]
      operationId: listTemplates
      x-dhumi-access: browser_user
      summary: List published Dhumi service templates
      description: Signed-in active users may browse all-access templates without organization membership. An optional authorized organization selector also exposes templates assigned to that organization.
      security:
        - BrowserBearer: []
      parameters:
        - name: family
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductFamily'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: Paginated templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/catalog/templates/{slug}:
    get:
      tags: [Catalogue]
      operationId: getTemplate
      x-dhumi-access: browser_user
      summary: Get one published Dhumi template
      description: Signed-in active users may read all-access templates without organization membership. Selected templates require an authorized organization with the access assignment.
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/TemplateSlug'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTemplate'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/catalog/templates/{slug}/sample:
    get:
      tags: [Catalogue]
      operationId: getMarketplaceSample
      x-dhumi-access: browser_user
      summary: Read one page from a governed stored Marketplace sample
      description: Counts are relative to the immutable stored sample. Signed-in active users need no organization for all-access templates. Selected templates require authorized organization access. This operation makes no provider request.
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/TemplateSlug'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: Stored sample page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSampleQueryResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/catalog/templates/{slug}/sample/query:
    post:
      tags: [Catalogue]
      operationId: queryMarketplaceSample
      x-dhumi-access: browser_user
      summary: Filter and project a governed stored Marketplace sample
      description: Filtering is local to Dhumi's immutable stored sample and makes no provider request. Signed-in active users need no organization for all-access templates; selected templates require authorized organization access. Session CSRF remains required.
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/TemplateSlug'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceSampleQueryInput' }
      responses:
        '200':
          description: Filtered and projected stored sample page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSampleQueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/catalog/templates/{slug}/sample/downloads:
    post:
      tags: [Catalogue]
      operationId: authorizeMarketplaceSampleDownload
      x-dhumi-access: organization_member
      summary: Authorize a bounded download of a governed stored Marketplace sample
      description: >-
        Serializes the exact masked, filtered and selected projection of Dhumi's
        immutable stored sample as JSON or CSV. JSON preserves projected field
        values and types, but is not byte-identical source JSON. CSV is for
        spreadsheet viewing and prefixes formula-like cells with a tab inside
        quotes; it is not a lossless interchange format or a universal
        spreadsheet-security guarantee. This operation makes no provider
        request and does not create a Service, Run or outbox event.
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/TemplateSlug'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceSampleDownloadInput' }
      responses:
        '201':
          description: Short-lived read-only sample-download authorization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSampleDownloadAuthorization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/catalog/templates/{slug}/expert-enquiries:
    post:
      tags: [Catalogue]
      operationId: createMarketplaceExpertEnquiry
      x-dhumi-access: organization_member
      summary: Ask a Dhumi data expert about a Marketplace dataset
      description: >-
        Records one authenticated, Tenant-scoped enquiry against the exact
        Marketplace preview Template version. This operation creates no
        payment, entitlement, Service, Run, outbox event or provider request.
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/TemplateSlug'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceExpertEnquiryInput' }
      responses:
        '201':
          description: Enquiry recorded, or the existing open enquiry returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceExpertEnquiry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/services:
    get:
      tags: [Services]
      operationId: listServices
      x-dhumi-access: organization_member
      summary: List tenant-owned services
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: Paginated services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Services]
      operationId: createService
      x-dhumi-access: organization_member
      summary: Create a tenant-owned service configuration
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateInput'
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/services/{service_id}:
    get:
      tags: [Services]
      operationId: getService
      x-dhumi-access: organization_member
      summary: Get one tenant-owned service
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /v1/services/{service_id}/runs:
    post:
      tags: [Runs]
      operationId: createRun
      x-dhumi-access: organization_member
      summary: Admit and queue a service run
      description: Returns after durable local admission; provider work is asynchronous.
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreateInput'
      responses:
        '202':
          description: Run durably accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/runs:
    get:
      tags: [Runs]
      operationId: listRuns
      x-dhumi-access: organization_member
      summary: List tenant runs
      security:
        - BrowserBearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RunStatus'
        - $ref: '#/components/parameters/ServiceIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: Paginated runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /v1/runs/{run_id}:
    get:
      tags: [Runs]
      operationId: getRun
      x-dhumi-access: organization_member
      summary: Get one tenant run
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /v1/runs/{run_id}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      x-dhumi-access: organization_member
      summary: Request best-effort cancellation
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '202':
          description: Cancellation request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/runs/{run_id}/retry:
    post:
      tags: [Runs]
      operationId: retryRun
      x-dhumi-access: organization_member
      summary: Create a new run from an eligible terminal run
      description: Never blindly repeats an unresolved provider attempt.
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '202':
          description: New run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/runs/{run_id}/events:
    get:
      tags: [Runs]
      operationId: listRunEvents
      x-dhumi-access: organization_member
      summary: List customer-safe run events
      security:
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OrganizationSelector'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: Paginated events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /v1/runs/{run_id}/result:
    get:
      tags: [Runs]
      operationId: getRunResult
