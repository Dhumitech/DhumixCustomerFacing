  /v1/verifications/{verification_id}/confirm:
    post:
      tags:
        - Organizations
      operationId: confirmVerification
      x-dhumi-access: purpose_bound_verification
      summary: confirm Verification
      description: >-
        Create/join requires the same signed-in user and CSRF; reset requires code and new_password, no email-link token.
        Fresh proof expires in ten minutes; five wrong attempts end it. A resend rotates code/link, with a 60-second
        cooldown and five issues per hour across purposes. GET never consumes a proof.
      security:
        - {}
        - BrowserBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: verification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-CSRF-Token
          in: header
          required: false
          schema:
            type: string
          description: Required for signed-in create/join proofs; reset is public OTP-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationConfirmInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationConfirmed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
