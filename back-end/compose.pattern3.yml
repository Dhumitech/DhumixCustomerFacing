services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /data
      - --debug
      - /data/azurite-debug.log
      - --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - pattern3-azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:10000/devstoreaccount1?comp=list',
          response => process.exit(response.statusCode < 500 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  pattern3-azurite-data:
